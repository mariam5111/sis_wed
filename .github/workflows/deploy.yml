name: Build and Deploy to Netlify

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تثبيت pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 3. إعداد بيئة Node.js مع كاش pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4. تثبيت الـ Dependencies باستخدام pnpm
      - name: Install dependencies
        run: pnpm install

      # 5. عمل Build للمشروع
      - name: Build project
        run: pnpm run build

      # 6. رفع مجلد dist إلى Netlify
      - name: Deploy to Netlify
        run: npx netlify-cli deploy --dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}